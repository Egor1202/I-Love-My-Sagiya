<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I love My S</title>
    <style>
        /* Глубокий синий фон */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #03112c; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Оболочка для автоматического масштабирования под любые экраны */
        .scaler {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 800px;
            height: 900px;
            transform-origin: center center;
        }

        /* Контейнер сцены */
        .container {
            position: relative;
            width: 800px;
            height: 900px;
        }

        /* Стили для всех мелких надписей i love you */
        .i_love_you {
            position: absolute;
            font-size: 15px;
            font-weight: 900;
            white-space: nowrap;
            user-select: none;
            opacity: 0;
            /* Плавный сбор при старте и переход в мягкую пульсацию */
            animation: assemble 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards,
                       heart-pulse 2.5s infinite ease-in-out 1.8s;
        }

        /* Неоново-розовый цвет для контура сердца */
        .heart-part {
            color: #ff5e97;
            text-shadow: 0 0 8px rgba(255, 94, 151, 0.6);
        }

        /* Белый цвет для отзеркаленной буквы S */
        .s-part {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Общие стили для верхней и нижней фразы */
        .text-phrase {
            position: absolute;
            color: #ff4081; /* Насыщенный розовый цвет */
            font-size: 42px; 
            font-weight: bold; 
            font-family: 'Georgia', serif;
            letter-spacing: 2px;
            white-space: nowrap;
            user-select: none;
            opacity: 0;
            text-shadow: 0 0 15px rgba(255, 64, 129, 0.7);
        }

        /* Верхняя надпись со смещением вправо */
        .top-phrase {
            left: 53%; 
            top: 20px; 
            transform: translateX(-50%);
            /* Начальное появление, переходящее в бесконечное плавное покачивание */
            animation: fadeInTop 2s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards 0.5s,
                       topPhraseMove 3s infinite ease-in-out 2.5s;
        }

        /* Особый красивый акцент на слове My */
        .top-phrase span {
            font-size: 46px;
            font-weight: 900;
        }

        /* Нижняя надпись Always & Forever — опущена ниже с запасом */
        .bottom-phrase {
            left: 50%;
            bottom: 20px; 
            transform: translateX(-50%);
            /* Начальное появление снизу, переходящее в покачивание */
            animation: fadeInBottom 2s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards 0.5s,
                       bottomPhraseMove 3s infinite ease-in-out 2.5s;
        }

        /* Анимация красивого сбора из хаоса для элементов сердца */
        @keyframes assemble {
            0% {
                transform: translate(var(--rx), var(--ry)) scale(0) rotate(var(--rt));
                opacity: 0;
            }
            100% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* Плавная анимация покачивания контура сердца */
        @keyframes heart-pulse {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(var(--mx), var(--my)) scale(1.06);
            }
            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        /* Плавное появление верхней надписи */
        @keyframes fadeInTop {
            0% {
                transform: translate(-50%, -40px) scale(0.8);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, 0) scale(1);
                opacity: 1;
            }
        }

        /* Плавное появление нижней надписи */
        @keyframes fadeInBottom {
            0% {
                transform: translate(-50%, 40px) scale(0.8);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, 0) scale(1);
                opacity: 1;
            }
        }

        /* Анимация покачивания для I love My */
        @keyframes topPhraseMove {
            0% { transform: translate(-50%, 0) scale(1); }
            50% { transform: translate(-50%, -8px) scale(1.02); }
            100% { transform: translate(-50%, 0) scale(1); }
        }

        /* Анимация покачивания для Always & Forever */
        @keyframes bottomPhraseMove {
            0% { transform: translate(-50%, 0) scale(1); }
            50% { transform: translate(-50%, 8px) scale(1.02); } 
            100% { transform: translate(-50%, 0) scale(1); }
        }
    </style>
</head>
<body>

    <div class="scaler" id="scaler-element">
        <div class="container" id="main-container">
            <div class="text-phrase top-phrase">I love <span>My</span></div>
            
            <div class="text-phrase bottom-phrase">Always & Forever</div>
        </div>
    </div>

    <script>
        const container = document.getElementById('main-container');
        const scaler = document.getElementById('scaler-element');
        const phrase = "i love you";

        // Автоматическое адаптивное масштабирование под размер экрана (мобильный/ПК)
        function resize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            // Выбираем минимальный коэффициент, чтобы всё влезло целиком
            const scale = Math.min(width / 820, height / 920);
            scaler.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resize);
        resize(); // Вызов при старте

        // Функция генерации случайного разлета букв
        function setFlightPath(element, angle) {
            const randomDist = 500 + Math.random() * 400;
            const randomAngle = Math.random() * Math.PI * 2;
            const rx = Math.cos(randomAngle) * randomDist;
            const ry = Math.sin(randomAngle) * randomDist;
            const randomRotation = -120 + Math.random() * 240;

            element.style.setProperty('--rx', `${rx}px`);
            element.style.setProperty('--ry', `${ry}px`);
            element.style.setProperty('--rt', `${randomRotation}deg`);

            // Вектор мягкого покачивания каждой точки
            element.style.setProperty('--mx', `${Math.sin(angle) * 8}px`);
            element.style.setProperty('--my', `${Math.cos(angle) * 8}px`);
            
            element.style.animationDelay = `${Math.random() * 0.4}s, ${1.8 + Math.random() * 0.2}s`;
        }

        // 1. СТРОИМ БОЛЬШОЕ РОЗОВОЕ СЕРДЦЕ
        const totalHeartPoints = 160;
        for (let i = 0; i < totalHeartPoints; i++) {
            const angle = (i / totalHeartPoints) * Math.PI * 2;
            
            const x = 16 * Math.pow(Math.sin(angle), 3);
            const y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));

            const span = document.createElement('span');
            span.className = 'i_love_you heart-part';
            span.innerText = phrase;

            const posX = 400 + x * 22;
            const posY = 450 + y * 22; // Сдвинуто к центру контейнера

            span.style.left = `${posX}px`;
            span.style.top = `${posY}px`;

            setFlightPath(span, angle);
            container.appendChild(span);
        }

        // 2. СТРОИМ БЕЛУЮ ОТЗЕРКАЛЕННУЮ БУКВУ S
        const sPoints = [
            {x: 25, y: -75}, {x: 50, y: -70}, {x: 70, y: -50}, {x: 65, y: -25}, {x: 45, y: -5}, {x: 20, y: 10},
            {x: -5, y: 20}, {x: -30, y: 35}, {x: -55, y: 45}, {x: -70, y: 65}, 
            {x: -65, y: 90}, {x: -45, y: 110}, {x: -20, y: 120}, {x: 15, y: 120}, {x: 45, y: 115}, {x: 65, y: 95},
            {x: -5, y: -80}, {x: -35, y: -75}, {x: -55, y: -60}
        ];

        sPoints.forEach((pt) => {
            const span = document.createElement('span');
            span.className = 'i_love_you s-part';
            span.innerText = phrase;

            const mirroredX = (pt.x * -1) + 20; 
            const posY = 430 + pt.y; // Сбалансировано внутри сердца

            span.style.left = `${400 + mirroredX}px`;
            span.style.top = `${posY}px`;

            const angle = Math.atan2(pt.y, mirroredX);
            setFlightPath(span, angle);

            container.appendChild(span);
        });
    </script>
</body>
</html>
